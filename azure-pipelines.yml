trigger:
- main

pool:
  vmImage: ubuntu-latest

variables:
  buildConfiguration: 'Release'
  dotNetVersion: '8.0.424'

stages:
  - stage: BuildDev
    displayName: Build for DEV
    jobs:
      - job: BuildApp
        displayName: Build APP .net
        steps:
          # install dotnet
          - task: UseDotNet@2
            displayName: 'install dotnet SDK $(dotNetVersion)'
            inputs:
              packageType: sdk
              version: '$(dotNetVersion)'

          # example list files in workspace
          - script: echo building dotnet app && ls -la
            workingDirectory: '$(System.DefaultWorkingDirectory)/MiniSln'
            displayName: building dotnet app

            # restore dependencies
          - task: DotNetCoreCLI@2
            displayName: 'restore dependencies'
            inputs:
              command: 'restore'
              projects: 'MiniSln/**/*.csproj'

            # build MiniSln
          - task: DotNetCoreCLI@2
            displayName: 'build'
            inputs:
              command: 'build'
              projects: 'MiniSln/**/*.csproj'
              arguments: '--configuration $(buildConfiguration) --no-restore'

          # test MiniSln
          - task: DotNetCoreCLI@2
            displayName: 'unit test'
            inputs:
              command: 'test'
              projects: 'MiniSln/**/*.csproj'
              arguments: '--configuration $(buildConfiguration) --no-build'

          # echo test 
          - script: echo running unit tests
            displayName: running unit tests

      # echo restore
      - job: RestoreDependencies
        displayName: Restore dependencies
        dependsOn: BuildApp
        steps:
          - script: echo dotnet restore
            displayName: restoring project dependencies
  - stage: BuildStaging
    dependsOn: BuildDev
    condition: succeeded('BuildDev')
    displayName: Build for Staging
    jobs:
      - job: BuildApp
        displayName: Build APP .net
        steps:
          - script: echo building dotnet app
            displayName: building dotnet app
          - script: echo running unit tests
            displayName: running unit tests
  - stage: DeployProd
    dependsOn: 
      - BuildDev
      - BuildStaging
    condition: and(succeeded('BuildDev'), succeeded('BuildStaging'))
    displayName: Build for Prod
    jobs:
      - job: BuildApp
        displayName: Build APP .net
        steps:
          - script: echo building dotnet app
            displayName: building dotnet app
          - script: echo running unit tests
            displayName: running unit tests
